services:
  - type: web
    name: rag-chatbot-api
    runtime: python
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        fromSecret: GEMINI_API_KEY
      - key: QDRANT_URL
        fromSecret: QDRANT_URL
      - key: QDRANT_API_KEY
        fromSecret: QDRANT_API_KEY
      - key: FRONTEND_URL
        value: https://your-docusaurus-site.onrender.com
    healthCheckPath: /api/health
    numInstances: 1
    plan: free  # Use free tier
    autoDeploy: true