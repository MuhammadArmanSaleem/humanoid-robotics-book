version: '3.8'

services:
  rag-chatbot-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Qdrant service if running locally (not needed for Qdrant Cloud)
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"
  #   volumes:
  #     - qdrant_data:/qdrant_data
  #   restart: unless-stopped

volumes:
  # qdrant_data:  # Uncomment if using local Qdrant